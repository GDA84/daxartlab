<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>DaxART Contour Plotter</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css"/>
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<style>
:root{--bg:#0b0d0f;--panel:#111518;--line:#2b3238;--text:#f3f5f6;--muted:#9ca7ae;--accent:#c8ff29;--paper:rgba(255,255,255,.18)}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}
#app{height:100%;display:grid;grid-template-columns:365px 1fr;overflow:hidden}aside{overflow:auto;background:var(--panel);padding:16px 16px 26px;border-right:1px solid var(--line)}h1{font-size:19px;margin:0 0 3px}.sub{font-size:12px;color:#a8c4d8;margin-bottom:18px}section{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.first{border:0;margin-top:0;padding-top:0}h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.topgap{margin-top:9px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:9px}label{font-size:11px;color:#cbd2d6}input,select{width:100%;background:#0d1012;color:#fff;border:1px solid #343b42;border-radius:8px;padding:9px 10px;outline:0}button{border:1px solid #3b444c;background:#22282d;color:#fff;border-radius:8px;padding:9px 11px;font-weight:700;cursor:pointer}.primary{background:var(--accent);border-color:var(--accent);color:#111}.wide{width:100%}.search{display:grid;grid-template-columns:1fr auto;gap:8px}#searchResults{display:none;border:1px solid #343b42;border-radius:8px;overflow:hidden;margin-top:6px;background:#0d1012}.result{padding:9px 10px;font-size:12px;border-bottom:1px solid #272e34;cursor:pointer}.result:hover{background:#1c2227}.toggle{display:flex;gap:7px;align-items:center;margin:7px 0}.toggle input{width:auto}.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}.stat{background:#0d1012;border:1px solid #272e34;border-radius:8px;padding:8px}.stat b{display:block;font-size:15px}.stat span{font-size:10px;color:var(--muted)}.status{white-space:pre-wrap;margin-top:8px;font-size:11px;line-height:1.4;padding:8px;background:#0d1012;border:1px solid #272e34;border-radius:8px;color:var(--muted);min-height:42px}.status.ok{color:#dcff92;border-color:#455b1b}.status.error{color:#ffcaca;border-color:#6a3333;background:#1b1010}
main{position:relative;overflow:hidden;background:#262b2f}#map{position:absolute;inset:0}#frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:2px solid var(--accent);background:var(--paper);box-shadow:0 0 0 9999px rgba(6,8,10,.34);z-index:5;pointer-events:none}#frame:before{content:"AREA DI STAMPA";position:absolute;top:-24px;left:-2px;background:var(--accent);color:#111;padding:4px 6px;border-radius:5px 5px 0 0;font-size:10px;font-weight:900;letter-spacing:.04em}#contourOverlay{position:absolute;inset:0;width:100%;height:100%;overflow:visible}#cross{position:absolute;z-index:6;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);pointer-events:none}#cross:before,#cross:after{content:"";position:absolute;background:var(--accent)}#cross:before{left:6px;width:2px;height:14px}#cross:after{top:6px;height:2px;width:14px}#help{position:absolute;left:12px;bottom:12px;z-index:7;background:rgba(10,12,14,.85);border:1px solid #384047;border-radius:7px;padding:7px 9px;font-size:11px}.maplibregl-ctrl-logo{display:none!important}.maplibregl-ctrl-attrib{font-size:10px!important}
@media(max-width:850px){#app{grid-template-columns:1fr;grid-template-rows:auto 60vh}aside{max-height:40vh;border-right:0;border-bottom:1px solid var(--line)}}

</style>
</head>
<body>
<div id="app">
<aside>
  <h1>DaxART Contour Plotter</h1>
  <div class="sub">Contour SVG reali · spacing libero · pen-plotter first</div>

  <section class="first">
    <h2>Area</h2>
    <div class="search"><input id="search" placeholder="Cerca Gran Sasso, Vesuvio, Mont Blanc…"><button id="searchBtn">Cerca</button></div>
    <div id="searchResults"></div>
    <div class="row topgap">
      <div class="field"><label>Latitudine</label><input id="lat" type="number" step="0.000001" value="42.463348"></div>
      <div class="field"><label>Longitudine</label><input id="lon" type="number" step="0.000001" value="13.631199"></div>
    </div>
    <button id="goCoords" class="wide">Vai alle coordinate</button>
  </section>

  <section>
    <h2>Foglio e scala</h2>
    <div class="row">
      <div class="field"><label>Formato</label><select id="paper"><option>A4</option><option>A3</option></select></div>
      <div class="field"><label>Orientamento</label><select id="orientation"><option value="landscape">Orizzontale</option><option value="portrait">Verticale</option></select></div>
    </div>
    <div class="row">
      <div class="field"><label>Scala 1:</label><input id="scale" type="number" min="1000" step="1000" value="250000"></div>
      <div class="field"><label>Margine (mm)</label><input id="margin" type="number" min="0" max="50" value="10"></div>
    </div>
  </section>

  <section>
    <h2>Contour</h2>
    <div class="row">
      <div class="field"><label>Spacing verticale (m)</label><input id="spacing" type="number" min="1" value="50"></div>
      <div class="field"><label>Index ogni N</label><input id="indexEvery" type="number" min="1" value="5"></div>
    </div>
    <div class="row">
      <div class="field"><label>Dettaglio DEM (m/px)</label><input id="demTarget" type="number" min="10" step="10" value="75"></div>
      <div class="field"><label>Penna (mm)</label><input id="pen" type="number" min="0.01" step="0.01" value="0.05"></div>
    </div>
    <button id="generate" class="primary wide">Genera contour</button>
  </section>

  <section>
    <h2>Ottimizzazione</h2>
    <div class="row">
      <div class="field"><label>Semplifica (m)</label><input id="simplify" type="number" min="0" value="25"></div>
      <div class="field"><label>Min path (m)</label><input id="minPath" type="number" min="0" value="500"></div>
    </div>
    <label class="toggle"><input id="showMap" type="checkbox" checked> Basemap in anteprima</label>
    <label class="toggle"><input id="showContours" type="checkbox" checked> Contour in anteprima</label>
  </section>

  <section>
    <h2>Output</h2>
    <div class="stats">
      <div class="stat"><b id="statPaths">—</b><span>path</span></div>
      <div class="stat"><b id="statVertices">—</b><span>vertici</span></div>
      <div class="stat"><b id="statDraw">—</b><span>m disegno</span></div>
      <div class="stat"><b id="statTiles">—</b><span>tile DEM</span></div>
    </div>
    <button id="exportSvg" class="primary wide">Esporta SVG</button>
    <div id="status" class="status">Inizializzazione…</div>
  </section>
</aside>
<main>
  <div id="map"></div>
  <div id="frame"><svg id="contourOverlay" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div id="cross"></div>
  <div id="help">trascina la mappa · poi premi “Genera contour”</div>
</main>
</div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);const PAPER={A4:[210,297],A3:[297,420]};const EARTH=40075016.686;const TILE=512;const MAX_Z=12;let map,last=null;
function status(msg,k=''){const e=$('status');e.textContent=msg;e.className='status'+(k?' '+k:'')}
function n(id,f=0){const v=Number($(id).value);return Number.isFinite(v)?v:f}
function dims(){let [w,h]=PAPER[$('paper').value]||PAPER.A4;if($('orientation').value==='landscape')[w,h]=[h,w];const m=Math.max(0,n('margin',10));return{pageW:w,pageH:h,w:Math.max(10,w-2*m),h:Math.max(10,h-2*m),m}}
function layout(){const main=document.querySelector('main'),d=dims(),pad=.08,maxW=main.clientWidth*(1-2*pad),maxH=main.clientHeight*(1-2*pad);let w=maxW,h=w*d.h/d.w;if(h>maxH){h=maxH;w=h*d.w/d.h}const f=$('frame');f.style.width=w+'px';f.style.height=h+'px';syncZoom();}
function mppTarget(){const d=dims(),fw=$('frame').getBoundingClientRect().width||800;return d.w/fw*(n('scale',250000)/1000)}
function syncZoom(){if(!map)return;const lat=map.getCenter().lat*Math.PI/180,mpp=mppTarget(),z=Math.log2(156543.03392804097*Math.cos(lat)/mpp);if(Number.isFinite(z))map.setZoom(Math.max(0,Math.min(16,z)))}
function frameRect(){const f=$('frame').getBoundingClientRect(),m=$('map').getBoundingClientRect();return{l:f.left-m.left,t:f.top-m.top,r:f.right-m.left,b:f.bottom-m.top,w:f.width,h:f.height}}
function frameBounds(){const r=frameRect(),nw=map.unproject([r.l,r.t]),se=map.unproject([r.r,r.b]);return{west:nw.lng,north:nw.lat,east:se.lng,south:se.lat}}
function lonX(lon,z){return(lon+180)/360*Math.pow(2,z)}function latY(lat,z){const rad=lat*Math.PI/180;return(1-Math.asinh(Math.tan(rad))/Math.PI)/2*Math.pow(2,z)}
function chooseZoom(bounds,target){const lat=(bounds.north+bounds.south)/2;let z=Math.round(Math.log2(EARTH*Math.cos(lat*Math.PI/180)/(TILE*Math.max(5,target))));z=Math.max(0,Math.min(MAX_Z,z));while(z>0){const x0=Math.floor(lonX(bounds.west,z)),x1=Math.floor(lonX(bounds.east,z)),y0=Math.floor(latY(bounds.north,z)),y1=Math.floor(latY(bounds.south,z));if((x1-x0+1)*(y1-y0+1)<=80)break;z--}return z}
async function fetchBitmap(url){const r=await fetch(url,{mode:'cors',cache:'force-cache'});if(!r.ok)throw new Error(`DEM HTTP ${r.status}`);return createImageBitmap(await r.blob())}
async function loadRaster(bounds,target){const z=chooseZoom(bounds,target),x0=Math.floor(lonX(bounds.west,z)),x1=Math.floor(lonX(bounds.east,z)),y0=Math.floor(latY(bounds.north,z)),y1=Math.floor(latY(bounds.south,z));const cols=x1-x0+1,rows=y1-y0+1,total=cols*rows;if(total>96)throw new Error(`Area troppo grande per il dettaglio richiesto (${total} tile). Aumenta Dettaglio DEM.`);$('statTiles').textContent=total;
 const mosaic=document.createElement('canvas');mosaic.width=cols*TILE;mosaic.height=rows*TILE;const ctx=mosaic.getContext('2d',{willReadFrequently:true});let done=0;
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){status(`Scarico DEM… ${++done}/${total} tile · z${z}`);const bm=await fetchBitmap(`https://tiles.mapterhorn.com/${z}/${x}/${y}.webp`);ctx.drawImage(bm,(x-x0)*TILE,(y-y0)*TILE,TILE,TILE);bm.close?.()}
 const worldLeft=lonX(bounds.west,z)*TILE,worldRight=lonX(bounds.east,z)*TILE,worldTop=latY(bounds.north,z)*TILE,worldBottom=latY(bounds.south,z)*TILE;let sx=Math.floor(worldLeft-x0*TILE),sy=Math.floor(worldTop-y0*TILE),sw=Math.max(2,Math.ceil(worldRight-worldLeft)),sh=Math.max(2,Math.ceil(worldBottom-worldTop));sx=Math.max(0,Math.min(mosaic.width-2,sx));sy=Math.max(0,Math.min(mosaic.height-2,sy));sw=Math.min(sw,mosaic.width-sx);sh=Math.min(sh,mosaic.height-sy);
 const data=ctx.getImageData(sx,sy,sw,sh);const elev=new Float32Array(sw*sh);for(let i=0,j=0;i<data.data.length;i+=4,j++)elev[j]=data.data[i]*256+data.data[i+1]+data.data[i+2]/256-32768;
 const groundMpp=EARTH*Math.cos(((bounds.north+bounds.south)/2)*Math.PI/180)/(Math.pow(2,z)*TILE);return{w:sw,h:sh,elev,z,groundMpp}}
function interp(a,b,va,vb,level){const den=vb-va,t=Math.abs(den)<1e-9?.5:(level-va)/den;return{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t}}
function generateSegments(r,spacing){const groups=new Map(),W=r.w,H=r.h,E=r.elev;const add=(lev,a,b)=>{let g=groups.get(lev);if(!g){g=[];groups.set(lev,g)}g.push([a,b])};
 for(let y=0;y<H-1;y++){if(y%80===0)status(`Calcolo isolinee… ${Math.round(y/(H-1)*100)}%`);for(let x=0;x<W-1;x++){const tl=E[y*W+x],tr=E[y*W+x+1],bl=E[(y+1)*W+x],br=E[(y+1)*W+x+1];if(![tl,tr,bl,br].every(Number.isFinite))continue;const mn=Math.min(tl,tr,bl,br),mx=Math.max(tl,tr,bl,br);let lev=Math.ceil(mn/spacing)*spacing;for(;lev<=mx;lev+=spacing){const ints=[];const pTL={x,y},pTR={x:x+1,y},pBR={x:x+1,y:y+1},pBL={x,y:y+1};if((tl<lev)!=(tr<lev))ints.push({e:'T',p:interp(pTL,pTR,tl,tr,lev)});if((tr<lev)!=(br<lev))ints.push({e:'R',p:interp(pTR,pBR,tr,br,lev)});if((br<lev)!=(bl<lev))ints.push({e:'B',p:interp(pBR,pBL,br,bl,lev)});if((bl<lev)!=(tl<lev))ints.push({e:'L',p:interp(pBL,pTL,bl,tl,lev)});if(ints.length===2)add(lev,ints[0].p,ints[1].p);else if(ints.length===4){const m=(tl+tr+bl+br)/4;if(m>=lev){add(lev,ints[0].p,ints[3].p);add(lev,ints[1].p,ints[2].p)}else{add(lev,ints[0].p,ints[1].p);add(lev,ints[2].p,ints[3].p)}}}}}
 return groups}
const pkey=p=>Math.round(p.x*1000)+','+Math.round(p.y*1000);
function stitch(segs){const by=new Map();segs.forEach((s,i)=>{for(const p of s){const k=pkey(p);if(!by.has(k))by.set(k,[]);by.get(k).push(i)}});const unused=new Set(segs.map((_,i)=>i)),out=[];function extend(line,front){while(true){const p=front?line[0]:line[line.length-1],cand=(by.get(pkey(p))||[]).find(i=>unused.has(i));if(cand==null)break;unused.delete(cand);const s=segs[cand],d0=Math.hypot(s[0].x-p.x,s[0].y-p.y),q=d0<1e-4?s[1]:s[0];front?line.unshift(q):line.push(q)}}
 while(unused.size){let seed=null;for(const i of unused){const s=segs[i],d0=(by.get(pkey(s[0]))||[]).filter(j=>unused.has(j)).length,d1=(by.get(pkey(s[1]))||[]).filter(j=>unused.has(j)).length;if(d0===1||d1===1){seed=i;break}}if(seed==null)seed=unused.values().next().value;unused.delete(seed);const line=[segs[seed][0],segs[seed][1]];extend(line,false);extend(line,true);out.push(line)}return out}
function rdp(pts,eps){if(pts.length<3||eps<=0)return pts;const sq=eps*eps;function d2(p,a,b){let x=a.x,y=a.y,dx=b.x-x,dy=b.y-y;if(dx||dy){const t=((p.x-x)*dx+(p.y-y)*dy)/(dx*dx+dy*dy);if(t>1){x=b.x;y=b.y}else if(t>0){x+=dx*t;y+=dy*t}}dx=p.x-x;dy=p.y-y;return dx*dx+dy*dy}function rec(a,b,o){let md=sq,idx=-1;for(let i=a+1;i<b;i++){const d=d2(pts[i],pts[a],pts[b]);if(d>md){md=d;idx=i}}if(idx>=0){if(idx-a>1)rec(a,idx,o);o.push(pts[idx]);if(b-idx>1)rec(idx,b,o)}}const o=[pts[0]];rec(0,pts.length-1,o);o.push(pts.at(-1));return o}
function plen(p){let s=0;for(let i=1;i<p.length;i++)s+=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);return s}
function process(groups,r){const spacing=Math.max(1,n('spacing',50)),idxN=Math.max(1,Math.round(n('indexEvery',5))),eps=n('simplify',25)/r.groundMpp,min=n('minPath',500)/r.groundMpp,paths=[];for(const [lev,segs] of groups){for(let line of stitch(segs)){line=rdp(line,eps);const lp=plen(line);if(line.length<2||lp<min)continue;paths.push({lev,index:Math.abs(Math.round(lev/spacing))%idxN===0,points:line,lenM:lp*r.groundMpp})}}return paths}
function render(paths,r){const svg=$('contourOverlay');svg.innerHTML='';svg.setAttribute('viewBox',`0 0 ${r.w} ${r.h}`);const pen=Math.max(.01,n('pen',.05));for(const p of paths){const el=document.createElementNS('http://www.w3.org/2000/svg','path');let d=`M ${p.points[0].x.toFixed(2)} ${p.points[0].y.toFixed(2)}`;for(let i=1;i<p.points.length;i++)d+=` L ${p.points[i].x.toFixed(2)} ${p.points[i].y.toFixed(2)}`;el.setAttribute('d',d);el.setAttribute('fill','none');el.setAttribute('stroke','#111');el.setAttribute('vector-effect','non-scaling-stroke');el.setAttribute('stroke-width',p.index?'1.1':'0.6');el.setAttribute('opacity',p.index?'1':'.82');svg.appendChild(el)}svg.style.display=$('showContours').checked?'block':'none'}
async function generate(){try{last=null;status('Preparo area DEM…');const b=frameBounds(),r=await loadRaster(b,Math.max(10,n('demTarget',75)));status(`DEM pronto · ${r.w}×${r.h}px · ~${r.groundMpp.toFixed(1)} m/px`);const groups=generateSegments(r,Math.max(1,n('spacing',50)));status('Collego e semplifico le curve…');const paths=process(groups,r);render(paths,r);const verts=paths.reduce((a,p)=>a+p.points.length,0),draw=paths.reduce((a,p)=>a+p.lenM,0);$('statPaths').textContent=paths.length.toLocaleString('it-IT');$('statVertices').textContent=verts.toLocaleString('it-IT');$('statDraw').textContent=Math.round(draw).toLocaleString('it-IT');last={paths,r,b};status(`OK · ${paths.length} path · contour ogni ${n('spacing',50)} m`,'ok')}catch(e){console.error(e);status((e&&e.message)||String(e),'error')}}
function exportSvg(){if(!last){status('Genera prima le contour.','error');return}const d=dims(),pen=Math.max(.01,n('pen',.05)),idxN=Math.max(1,Math.round(n('indexEvery',5)));let minor='',major='';const sx=d.w/(last.r.w-1),sy=d.h/(last.r.h-1);const esc=v=>Number(v).toFixed(3).replace(/\.0+$/,'').replace(/(\.\d*?)0+$/,'$1');for(const p of last.paths){let q=p.points[0],s=`M ${esc(d.m+q.x*sx)} ${esc(d.m+q.y*sy)}`;for(let i=1;i<p.points.length;i++){q=p.points[i];s+=` L ${esc(d.m+q.x*sx)} ${esc(d.m+q.y*sy)}`}if(p.index)major+=`<path d="${s}"/>\n`;else minor+=`<path d="${s}"/>\n`}const txt=`<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="${d.pageW}mm" height="${d.pageH}mm" viewBox="0 0 ${d.pageW} ${d.pageH}">\n<g id="minor-contours" fill="none" stroke="#000" stroke-width="${pen}" stroke-linecap="round" stroke-linejoin="round">${minor}</g>\n<g id="index-contours" fill="none" stroke="#000" stroke-width="${pen*1.8}" stroke-linecap="round" stroke-linejoin="round">${major}</g>\n</svg>`;const blob=new Blob([txt],{type:'image/svg+xml'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`contours_${n('spacing',50)}m_1-${Math.round(n('scale',250000))}.svg`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);status(`SVG esportato · ${(blob.size/1024/1024).toFixed(2)} MB`,'ok')}
async function search(){const q=$('search').value.trim();if(!q)return;const box=$('searchResults');box.style.display='block';box.innerHTML='<div class="result">Ricerca…</div>';try{const r=await fetch('https://photon.komoot.io/api/?limit=6&lang=it&q='+encodeURIComponent(q));if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();box.innerHTML='';if(!j.features?.length){box.innerHTML='<div class="result">Nessun risultato</div>';return}for(const f of j.features){const [lon,lat]=f.geometry.coordinates,p=f.properties||{},name=[p.name,p.city,p.state,p.country].filter(Boolean).join(', '),e=document.createElement('div');e.className='result';e.textContent=name||`${lat.toFixed(4)}, ${lon.toFixed(4)}`;e.onclick=()=>{map.easeTo({center:[lon,lat],duration:700});box.style.display='none';$('lat').value=lat.toFixed(6);$('lon').value=lon.toFixed(6)};box.appendChild(e)}}catch(e){box.innerHTML='<div class="result">Ricerca non disponibile: usa lat/lon.</div>'}}
function init(){if(!window.maplibregl){status('MapLibre non caricato.','error');return}map=new maplibregl.Map({container:'map',center:[n('lon',13.63),n('lat',42.46)],zoom:9,dragRotate:false,style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors'}},layers:[{id:'bg',type:'background',paint:{'background-color':'#e8e8e4'}},{id:'osm',type:'raster',source:'osm',paint:{'raster-opacity':.88,'raster-saturation':-.45}}]}});map.scrollZoom.disable();map.doubleClickZoom.disable();map.boxZoom.disable();map.keyboard.disable();map.touchZoomRotate.disableRotation();map.on('load',()=>{layout();status('Pronto. Posiziona l’area e premi “Genera contour”.','ok')});map.on('moveend',()=>{$('lat').value=map.getCenter().lat.toFixed(6);$('lon').value=map.getCenter().lng.toFixed(6);syncZoom();last=null;$('contourOverlay').innerHTML=''});
 $('searchBtn').onclick=search;$('search').addEventListener('keydown',e=>{if(e.key==='Enter')search()});$('goCoords').onclick=()=>map.easeTo({center:[n('lon'),n('lat')],duration:500});$('generate').onclick=generate;$('exportSvg').onclick=exportSvg;$('showMap').onchange=()=>map.setLayoutProperty('osm','visibility',$('showMap').checked?'visible':'none');$('showContours').onchange=()=>{$('contourOverlay').style.display=$('showContours').checked?'block':'none'};['paper','orientation','margin','scale'].forEach(id=>$(id).addEventListener('change',()=>{layout();last=null;$('contourOverlay').innerHTML=''}));$('scale').addEventListener('input',()=>{clearTimeout(window.__st);window.__st=setTimeout(()=>{syncZoom();last=null;$('contourOverlay').innerHTML=''},250)});window.addEventListener('resize',layout)}
init();
